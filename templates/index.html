<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador de Videos</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #8BC6EC 0%, #9599E2 50%, #a18cd1 100%); }
        .container { max-width: 500px; width: 90%; padding: 40px 30px; border-radius: 20px; background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2); text-align: center; }
        h1 { color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.2); margin-top: 0; }
        p { color: #fff; font-weight: 500; margin-bottom: 20px; }
        input[type="text"] { width: 90%; padding: 15px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.3); color: #333; outline: none; font-size: 16px; transition: 0.3s; margin-bottom: 15px; backdrop-filter: blur(4px); }
        input[type="text"]:focus { background: rgba(255, 255, 255, 0.6); }
        button { padding: 15px 40px; border-radius: 15px; border: none; background: linear-gradient(45deg, #007bff, #0056b3); color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3); }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        #contador { display: none; margin-top: 25px; font-weight: bold; color: #fff; }
        #warning { display: none; color: #ffe484; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 10px; margin-top: 10px; font-size: 14px; }
        #botonesDescarga { display: none; margin-top: 25px; }
        #botonesDescarga h3 { color: #fff; margin-bottom: 10px; }
        #botonesDescarga button { margin: 6px; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.4); color: #fff; font-size: 14px; padding: 12px 20px; }
        #botonesDescarga button:hover { background: rgba(255, 255, 255, 0.5); color: #000; }
        a { text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Descargador de Videos</h1>
        <p>Pega el enlace de YouTube, TikTok o Instagram:</p>
        <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=...">
        <br>
        <button id="btnDownload">Descargar</button>

        <div id="contador">
            <p>Procesando tu enlace, espera <span id="timer">0</span> segundos...</p>
            <div id="warning">⚠️ No cambies de pestaña o se pausará</div>
        </div>
        <div id="botonesDescarga"></div>
    </div>

    <script>
        const btn = document.getElementById('btnDownload');
        const contadorDiv = document.getElementById('contador');
        const botonesDiv = document.getElementById('botonesDescarga');
        const timerSpan = document.getElementById('timer');
        const warning = document.getElementById('warning');

        const POLL_INTERVAL_MS = 2000;   // consulta status cada 2 segundos
        const MAX_WAIT_SECONDS = 40;     // tiempo máximo de espera visible al usuario

        let pollTimer = null;
        let elapsedSeconds = 0;
        let tickTimer = null;

        btn.addEventListener('click', function() {
            const url = document.getElementById('url').value.trim();
            if (!url) {
                alert('Pega una URL primero');
                return;
            }

            resetUI();
            btn.disabled = true;
            contadorDiv.style.display = 'block';

            fetch('/start-download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`No se pudo iniciar la descarga (Error ${response.status})`);
                }
                return response.json();
            })
            .then(data => {
                if (data.error) {
                    mostrarError(data.error);
                    return;
                }
                iniciarPolling(data.job_id);
                iniciarContadorVisible();
            })
            .catch(err => {
                mostrarError(err.message);
            });
        });

        function resetUI() {
            contadorDiv.style.display = 'none';
            botonesDiv.style.display = 'none';
            botonesDiv.innerHTML = '';
            warning.style.display = 'none';
            elapsedSeconds = 0;
            timerSpan.textContent = '0';
            if (pollTimer) clearInterval(pollTimer);
            if (tickTimer) clearInterval(tickTimer);
        }

        function iniciarContadorVisible() {
            // Solo cuenta segundos "reales" mientras la pestaña está visible,
            // igual que en la versión anterior, pero ahora acompaña al polling
            // en vez de determinar cuándo mostrar el resultado.
            tickTimer = setInterval(() => {
                if (document.visibilityState === 'visible') {
                    warning.style.display = 'none';
                    elapsedSeconds++;
                    timerSpan.textContent = elapsedSeconds;

                    if (elapsedSeconds >= MAX_WAIT_SECONDS) {
                        clearInterval(tickTimer);
                        clearInterval(pollTimer);
                        mostrarError('El servidor tardó demasiado. Intenta con otro video o vuelve a intentarlo.');
                    }
                } else {
                    warning.style.display = 'block';
                }
            }, 1000);
        }

        function iniciarPolling(jobId) {
            pollTimer = setInterval(() => {
                fetch(`/status/${jobId}`)
                    .then(res => res.json())
                    .then(job => {
                        if (job.status === 'done') {
                            clearInterval(pollTimer);
                            clearInterval(tickTimer);
                            contadorDiv.style.display = 'none';
                            mostrarBotones(job.data);
                        } else if (job.status === 'error') {
                            clearInterval(pollTimer);
                            clearInterval(tickTimer);
                            mostrarError(job.error);
                        } else if (job.status === 'not_found') {
                            clearInterval(pollTimer);
                            clearInterval(tickTimer);
                            mostrarError('No se encontró el proceso. Intenta de nuevo.');
                        }
                        // si sigue "processing", no hacemos nada y esperamos el próximo poll
                    })
                    .catch(() => {
                        // un fallo puntual de red en el polling no debe abortar todo;
                        // simplemente se reintenta en el próximo tick
                    });
            }, POLL_INTERVAL_MS);
        }

        function mostrarError(mensaje) {
            contadorDiv.style.display = 'none';
            botonesDiv.style.display = 'block';
            botonesDiv.innerHTML = `<p style="color:#fff;">${mensaje}</p>`;
            btn.disabled = false;
        }

        function mostrarBotones(data) {
            let html = `<h3>${data.title}</h3><p style="color:#fff;">Elige calidad:</p>`;

            data.videos.forEach(v => {
                html += `<a href="${v.url}" download target="_blank"><button>MP4 - ${v.quality}</button></a> `;
            });
            data.audios.forEach(a => {
                html += `<a href="${a.url}" download target="_blank"><button>MP3 - ${a.quality}</button></a> `;
            });
            botonesDiv.innerHTML = html;
            botonesDiv.style.display = 'block';
            btn.disabled = false;
        }
    </script>
</body>
</html>
